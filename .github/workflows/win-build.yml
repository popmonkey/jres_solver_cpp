name: Windows [reusable] Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      arch:
        type: string
        default: 'x64'
        required: false
      upload_assets:
        type: boolean
        required: true

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      # Match the tag/filename from your highs-artifacts.yml
      HIGHS_TAG: highs-static-v1.12.0
      HIGHS_ZIP: highs-v1.12.0-windows-x64.zip
      HIGHS_DIR: ${{ github.workspace }}\highs
      ASSET_NAME: "" 
      ROOT_DIR: ""
      SAFE_VERSION: ""
      SAFE_ARCH: ""
      
    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0 

    # ---------------------------------------------------------
    # Download Pre-built HiGHS (Static)
    # ---------------------------------------------------------
    - name: Prepare HiGHS directory
      shell: pwsh
      run: New-Item -ItemType Directory -Path "$env:HIGHS_DIR" | Out-Null

    - name: Download HiGHS Artifact
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download $env:HIGHS_TAG `
          --pattern $env:HIGHS_ZIP `
          --output "$env:HIGHS_DIR\highs.zip" `
          --repo ${{ github.repository }}
        
        Expand-Archive -Path "$env:HIGHS_DIR\highs.zip" -DestinationPath "$env:HIGHS_DIR" -Force

    # ---------------------------------------------------------
    # Build
    # ---------------------------------------------------------
    - name: Configure CMake (MSVC)
      shell: pwsh
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:HIGHS_DIR" `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\dist" `
          -DBUILD_SHARED_LIBS=OFF `
          -DJRES_VERSION="${{ inputs.version }}"

    - name: Add Build Dir to PATH
      shell: pwsh
      run: |
        "${{ github.workspace }}\build\Release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build Libraries & Executables
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Run Tests
      shell: pwsh
      run: | 
        cmake --build build --config Release --target solver_tests
        cmake --build build --config Release --target formatter_tests
        ctest --test-dir build --output-on-failure -C Release

    - name: Run Integration Tests
      shell: pwsh
      run: ./test/integration/run_test.bat

    # ---------------------------------------------------------
    # Install (Stage Files)
    # ---------------------------------------------------------
    - name: Install Artifacts
      shell: pwsh
      run: cmake --install build --config Release

    # ---------------------------------------------------------
    # Package binaries (Zip for Windows)
    # ---------------------------------------------------------

    - name: Sanitize Inputs
      run: |
        $safeVersion = "${{ inputs.version }}".ToLower() -replace '[^a-z0-9-]', '_'
        $safeArch = "${{ inputs.arch }}".ToLower() -replace '[^a-z0-9-]', '_'
        
        echo "SAFE_VERSION=$safeVersion" >> $env:GITHUB_ENV
        echo "SAFE_ARCH=$safeArch" >> $env:GITHUB_ENV

    - name: Set Asset Name
      shell: pwsh
      run: | 
        $rootDir = "jres_solver-${{ env.SAFE_VERSION }}-windows-${{ env.SAFE_ARCH }}"
        $assetName = "$rootDir.zip"
        echo "ROOT_DIR=$rootDir" >> $env:GITHUB_ENV
        echo "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

    - name: Package (Curated Selection)
      shell: pwsh
      run: |
        $pkg = "package"
        $rootDir = "${{ env.ROOT_DIR }}"
        $base = Join-Path $pkg $rootDir

        New-Item -ItemType Directory -Path (Join-Path $base "bin") -Force | Out-Null
        New-Item -ItemType Directory -Path (Join-Path $base "lib") -Force | Out-Null
        New-Item -ItemType Directory -Path (Join-Path $base "include\jres_solver") -Force | Out-Null

        Write-Host "Packaging Binary Artifacts..."
        
        # Executables
        Copy-Item "dist\bin\jres_solver.exe" -Destination (Join-Path $base "bin")
        Copy-Item "dist\bin\jres_formatter.exe" -Destination (Join-Path $base "bin")
        
        # Library (static)
        if (Test-Path "dist\lib\jres_solver.lib") {
            Copy-Item "dist\lib\jres_solver.lib" -Destination (Join-Path $base "lib")
        }
        
        # Public Headers
        Copy-Item "dist\include\jres_solver\*.hpp" -Destination (Join-Path $base "include\jres_solver")

        # Zip the package folder
        $assetPath = "$env:ASSET_NAME"
        Write-Host "Zipping curated package to $assetPath..."
        
        # Zip the contents of 'package' (which is just the ROOT_DIR folder)
        Get-ChildItem -Path $pkg | Compress-Archive -DestinationPath $assetPath

    # ---------------------------------------------------------
    # Generate Signature (Checksum)
    # ---------------------------------------------------------
    - name: Generate Checksum
      shell: pwsh
      run: |
        $hashFile = "${{ env.ASSET_NAME }}.sha256"
        $hash = Get-FileHash -Path "${{ env.ASSET_NAME }}" -Algorithm SHA256
        # Format standard: HASH  FILENAME
        "$($hash.Hash.ToLower())  ${{ env.ASSET_NAME }}" | Out-File -FilePath $hashFile -Encoding ascii
        Get-Content $hashFile

    # ---------------------------------------------------------
    # Upload Release Assets
    # ---------------------------------------------------------
    - name: Upload Release Assets
      if: inputs.upload_assets == true
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ inputs.version }}" `
          "${{ env.ASSET_NAME }}" `
          "${{ env.ASSET_NAME }}.sha256" `
          --clobber

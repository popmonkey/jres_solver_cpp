name: Windows [reusable] Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      arch:
        type: string
        default: 'x64'
        required: false
      upload_assets:
        type: boolean
        required: true
      upload_url:
        type: string
        required: false

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      CBC_TAG: cbc-windows-static
      CBC_ZIP: cbc-windows-x64-static.zip
      CBC_DIR: ${{ github.workspace }}\cbc
      VCPKG_INSTALLED: ${{ github.workspace }}\cbc\installed\x64-windows-static

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0 

    - name: Prepare CBC directory
      shell: pwsh
      run: |
        if (Test-Path "$env:CBC_DIR") {
          Remove-Item -Recurse -Force "$env:CBC_DIR"
        }
        New-Item -ItemType Directory -Path "$env:CBC_DIR" | Out-Null

    - name: Download CBC artifact from release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download $env:CBC_TAG `
          --pattern $env:CBC_ZIP `
          --output "$env:CBC_DIR\cbc.zip" `
          --repo $env:GITHUB_REPOSITORY
        Expand-Archive -Path "$env:CBC_DIR\cbc.zip" -DestinationPath "$env:CBC_DIR" -Force

    - name: Configure CMake (MSVC)
      shell: pwsh
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCBC_DIR="$env:CBC_DIR"

    - name: Build Libraries & Executables
      shell: pwsh
      run: |
        cmake --build build --config Release --target jres_solver
        cmake --build build --config Release --target solver
        cmake --build build --config Release --target formatter

    - name: Add Build Dir to PATH
      shell: pwsh
      run: |
        "${{ github.workspace }}\build\Release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run Tests
      shell: pwsh
      run: | 
        cmake --build build --config Release --target solver_tests
        cmake --build build --config Release --target formatter_tests
        ctest --test-dir build --output-on-failure -C Release

    # ---------------------------------------------------------
    # Package binaries (Zip for Windows)
    # ---------------------------------------------------------

    - name: Sanitize Inputs
      run: |
        # Helper function block not strictly needed for one-liners, 
        # but doing it inline is cleaner for GitHub Actions env vars
        
        $safeVersion = "${{ inputs.version }}".ToLower() -replace '[^a-z0-9-]', '_'
        $safePlatform = "${{ inputs.platform }}".ToLower() -replace '[^a-z0-9-]', '_'
        $safeArch = "${{ inputs.arch }}".ToLower() -replace '[^a-z0-9-]', '_'
        
        echo "SAFE_VERSION=$safeVersion" >> $env:GITHUB_ENV
        echo "SAFE_PLATFORM=$safePlatform" >> $env:GITHUB_ENV
        echo "SAFE_ARCH=$safeArch" >> $env:GITHUB_ENV

    - name: Set Asset Name
      # Naming Convention: jres-solver-[version]-windows-[arch].zip
      run: echo "ASSET_NAME=jres-solver-${{ env.SAFE_VERSION }}-${{ env.SAFE_PLATFORM }}-${{ env.SAFE_ARCH }}.${{ inputs.asset_ext }}" >> $env:GITHUB_ENV

    - name: Create Release Zip
      shell: pwsh
      run: |
        # Use the environment variable $env:ASSET_NAME you set earlier
        $assetPath = "$env:ASSET_NAME"
        
        $source = "${{ github.workspace }}\build\Release"
        Write-Host "Zipping binaries from $source to $assetPath..."
        
        Get-ChildItem $source -Include *.exe, *.dll, *.lib -Recurse | Compress-Archive -DestinationPath $assetPath

    # ---------------------------------------------------------
    # Generate Signature (Checksum)
    # ---------------------------------------------------------
    - name: Generate Checksum
      shell: pwsh
      run: |
        $hashFile = "${{ env.ASSET_NAME }}.sha256"
        $hash = Get-FileHash -Path "${{ env.ASSET_NAME }}" -Algorithm SHA256
        # Format standard: HASH  FILENAME
        "$($hash.Hash.ToLower())  ${{ env.ASSET_NAME }}" | Out-File -FilePath $hashFile -Encoding ascii
        Get-Content $hashFile

    # ---------------------------------------------------------
    # Upload Release Assets
    # ---------------------------------------------------------
    - name: Upload Release Asset (Zip)
      if: inputs.upload_assets == true
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ inputs.upload_url }}
        asset_path: ./${{ env.ASSET_NAME }}
        asset_name: ${{ env.ASSET_NAME }}
        asset_content_type: application/zip

    - name: Upload Release Asset (Checksum)
      if: inputs.upload_assets == true
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ inputs.upload_url }}
        asset_path: ./${{ env.ASSET_NAME }}.sha256
        asset_name: ${{ env.ASSET_NAME }}.sha256
        asset_content_type: text/plain

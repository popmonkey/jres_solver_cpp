name: Windows [reusable] Build

on:
  workflow_call:
    inputs:
      upload_assets:
        type: boolean
        required: true
      upload_url:
        type: string
        required: false

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      CBC_TAG: cbc-windows-static
      CBC_ZIP: cbc-windows-x64-static.zip
      CBC_DIR: ${{ github.workspace }}\cbc
      VCPKG_INSTALLED: ${{ github.workspace }}\cbc\installed\x64-windows-static

    steps:

    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0 

    - name: Diagnostic - List lib directory content
      shell: pwsh
      run: |
        Write-Host "=== Listing Source 'lib' Directory Contents (Submodule Check) ==="
        Get-ChildItem "${{ github.workspace }}\lib" -Recurse | Select-Object FullName, LastWriteTime, @{N='Length';E={$_.Length / 1KB}} | Format-Table -Wrap

    - name: Prepare CBC directory
      shell: pwsh
      run: |
        if (Test-Path "$env:CBC_DIR") {
          Remove-Item -Recurse -Force "$env:CBC_DIR"
        }
        New-Item -ItemType Directory -Path "$env:CBC_DIR" | Out-Null

    - name: Download CBC artifact from release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download $env:CBC_TAG `
          --pattern $env:CBC_ZIP `
          --output "$env:CBC_DIR\cbc.zip" `
          --repo $env:GITHUB_REPOSITORY

    - name: Extract CBC
      shell: pwsh
      run: |
        Expand-Archive -Path "$env:CBC_DIR\cbc.zip" -DestinationPath "$env:CBC_DIR" -Force
        Write-Host "Extracted CBC into:"
        Get-ChildItem $env:CBC_DIR -Recurse

    # ------------------------------------------------------------------
    # Configure CMake (MSVC)
    # ------------------------------------------------------------------
    - name: Configure CMake (MSVC)
      shell: pwsh
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCBC_DIR="$env:CBC_DIR"

    - name: Validate CBC Layout
      shell: pwsh
      run: |
        Write-Host "=== Validating CBC Artifact Layout ==="
        $root = "$env:CBC_DIR/x64-windows-static"
        $include = "$root/include/coin-or"
        $lib     = "$root/lib"

        if (!(Test-Path $include)) { Write-Error "FATAL: CBC include directory missing: $include"; exit 1 }
        if (!(Test-Path $lib)) { Write-Error "FATAL: CBC library directory missing: $lib"; exit 1 }
        Write-Host "CBC artifact validation: OK ✓"

    # ------------------------------------------------------------------
    # Build Library (jres_solver only)
    # ------------------------------------------------------------------
    - name: Build Library (jres_solver only)
      shell: pwsh
      run: cmake --build build --config Release --target jres_solver

    # ------------------------------------------------------------------
    # Diagnostic - Locate jres_solver.lib
    # ------------------------------------------------------------------
    - name: Diagnostic - Locate jres_solver.lib (Full Workspace Scan)
      shell: pwsh
      timeout-minutes: 5
      run: |
        Write-Host "=== POST-LIBRARY BUILD DUMP: JRES_SOLVER.LIB FULL WORKSPACE SEARCH ==="
        $workspaceRoot = "D:\a"
        $libName = "jres_solver.lib"
        $foundFile = Get-ChildItem -Path $workspaceRoot -Filter $libName -Recurse -ErrorAction SilentlyContinue
        if ($foundFile) {
            Write-Host "--- CRITICAL FINDING: $libName LOCATED ---"
            $foundFile | Select-Object FullName, Name, Length | Format-Table -Wrap
        } else {
            Write-Error "--- FATAL: $libName WAS NOT GENERATED ANYWHERE IN THE WORKSPACE (D:\a) ---"
        }

    # ------------------------------------------------------------------
    # SETUP: Add DLL path to environment for runtime execution
    # ------------------------------------------------------------------
    - name: Set DLL Runtime Path
      shell: pwsh
      run: |
        $dll_path = "${{ github.workspace }}\build\Release"
        Write-Host "Adding DLL path to environment for runtime search: $dll_path"
        echo "PATH=$dll_path;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # ------------------------------------------------------------------
    # Build & Test
    # ------------------------------------------------------------------
    - name: Build Solver Executable
      shell: pwsh
      run: cmake --build build --config Release --target solver
      
    - name: Run Solver Sanity Check
      shell: pwsh
      run: |
        $solver_exe = "${{ github.workspace }}\build\Release\solver.exe"
        & $solver_exe -h

    # --- Formatter Build ---
    - name: Build Formatter Executable
      shell: pwsh
      run: cmake --build build --config Release --target formatter

    - name: Run Formatter Sanity Check
      shell: pwsh
      run: |
        $formatter_exe = "${{ github.workspace }}\build\Release\formatter.exe"
        & $formatter_exe -h
    # ----------------------------

    - name: Build Test Executables
      shell: pwsh
      run: | 
        cmake --build build --config Release --target solver_tests
        cmake --build build --config Release --target formatter_tests
      
    - name: Run Tests (ctest)
      shell: pwsh
      run: ctest --test-dir build --output-on-failure -C Release

    # ---------------------------------------------------------
    # Package binaries (Zip for Windows)
    # ---------------------------------------------------------
    - name: Create Release Zip
      shell: pwsh
      run: |
        $assetName = "jres-solver-windows-x64.zip"
        echo "ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
        $source = "${{ github.workspace }}\build\Release"
        Write-Host "Zipping binaries from $source..."
        
        # Compress executables, DLLs, and LIBs
        Get-ChildItem $source -Include *.exe, *.dll, *.lib -Recurse | Compress-Archive -DestinationPath $assetName

    # ---------------------------------------------------------
    # Upload to release (if enabled)
    # ---------------------------------------------------------
    - name: Upload Release Asset
      if: inputs.upload_assets == true
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ inputs.upload_url }}
        asset_path: ./${{ env.ASSET_NAME }}
        asset_name: ${{ env.ASSET_NAME }}
        asset_content_type: application/zip

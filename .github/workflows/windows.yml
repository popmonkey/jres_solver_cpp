name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      CBC_TAG: cbc-windows-static
      CBC_ZIP: cbc-windows-x64-static.zip
      CBC_DIR: ${{ github.workspace }}\cbc
      VCPKG_INSTALLED: ${{ github.workspace }}\cbc\installed\x64-windows-static

    steps:

    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true  # Pulls in cxxopts and nlohmann/json
        fetch-depth: 0 

    - name: Diagnostic - List lib directory content
      shell: pwsh
      run: |
        Write-Host "=== Listing Source 'lib' Directory Contents (Submodule Check) ==="
        Get-ChildItem "${{ github.workspace }}\lib" -Recurse | Select-Object FullName, LastWriteTime, @{N='Length';E={$_.Length / 1KB}} | Format-Table -Wrap

    - name: Prepare CBC directory
      shell: pwsh
      run: |
        if (Test-Path "$env:CBC_DIR") {
          Remove-Item -Recurse -Force "$env:CBC_DIR"
        }
        New-Item -ItemType Directory -Path "$env:CBC_DIR" | Out-Null

    - name: Download CBC artifact from release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download $env:CBC_TAG `
          --pattern $env:CBC_ZIP `
          --output "$env:CBC_DIR\cbc.zip" `
          --repo $env:GITHUB_REPOSITORY

    - name: Extract CBC
      shell: pwsh
      run: |
        Expand-Archive -Path "$env:CBC_DIR\cbc.zip" -DestinationPath "$env:CBC_DIR" -Force
        Write-Host "Extracted CBC into:"
        Get-ChildItem $env:CBC_DIR -Recurse

    - name: Configure CMake (MSVC)
      shell: pwsh
      run: |
        $I = "$env:VCPKG_INSTALLED\include"
        $L = "$env:VCPKG_INSTALLED\lib"

        Write-Host "Using INCLUDE dir: $I"
        Write-Host "Using LIB dir: $L"

        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCBC_DIR="$env:CBC_DIR"

    - name: Validate CBC Layout
      shell: pwsh
      run: |
        Write-Host "=== Validating CBC Artifact Layout ==="

        $root = "$env:CBC_DIR/x64-windows-static"
        $include = "$root/include/coin-or"
        $lib     = "$root/lib"

        Write-Host "Expect INCLUDE dir: $include"
        Write-Host "Expect LIB dir:     $lib"

        if (!(Test-Path $include)) {
          Write-Error "FATAL: CBC include directory missing: $include"
          exit 1
        }

        if (!(Test-Path $lib)) {
          Write-Error "FATAL: CBC library directory missing: $lib"
          exit 1
        }

        # Expected header files
        $headers = @(
          "OsiClpSolverInterface.hpp",
          "OsiSolverInterface.hpp",
          "CbcModel.hpp",
          "CoinPragma.hpp"
        )

        foreach ($h in $headers) {
          $path = Join-Path $include $h
          if (!(Test-Path $path)) {
            Write-Error "FATAL: Missing expected header: $path"
            exit 1
          }
        }

        # Expected libraries
        $libs = @(
          "Cbc.lib",
          "Clp.lib",
          "Osi.lib",
          "OsiClp.lib",
          "CoinUtils.lib"
        )

        foreach ($l in $libs) {
          $path = Join-Path $lib $l
          if (!(Test-Path $path)) {
            Write-Error "FATAL: Missing expected library: $path"
            exit 1
          }
        }

        Write-Host "CBC artifact validation: OK ✓"

    # ------------------------------------------------------------------
    # STEP 1: Build ONLY the jres_solver library
    # ------------------------------------------------------------------
    - name: Build Library (jres_solver only)
      shell: pwsh
      run: cmake --build build --config Release --target jres_solver

    # ------------------------------------------------------------------
    # STEP 2: DUMP FILE SYSTEM (CONFIRM .lib LOCATION)
    # ------------------------------------------------------------------
    # NOTE: This step now confirms jres_solver.lib/dll exist in build/Release
    - name: Diagnostic - Locate jres_solver.lib (Full Workspace Scan)
      shell: pwsh
      timeout-minutes: 5 # Allow ample time for a recursive search of the workspace
      run: |
        Write-Host "=== POST-LIBRARY BUILD DUMP: JRES_SOLVER.LIB FULL WORKSPACE SEARCH ==="
        
        $workspaceRoot = "D:\a"
        $libName = "jres_solver.lib"
        
        Write-Host "Searching recursively for $libName starting from: $workspaceRoot"
        
        $foundFile = Get-ChildItem -Path $workspaceRoot -Filter $libName -Recurse -ErrorAction SilentlyContinue
        
        if ($foundFile) {
            Write-Host "--- CRITICAL FINDING: $libName LOCATED ---"
            $foundFile | Select-Object FullName, Name, Length | Format-Table -Wrap
        } else {
            Write-Error "--- FATAL: $libName WAS NOT GENERATED ANYWHERE IN THE WORKSPACE (D:\a) ---"
        }

        $release_build_dir = "${{ github.workspace }}\build\Release"
        Write-Host "--- Contents of DLL folder ($release_build_dir) ---"
        Get-ChildItem $release_build_dir -Filter "*jres_solver.*" | Select-Object FullName, Name, Length | Format-Table -Wrap
        
        Write-Host "=================================================="

    # ------------------------------------------------------------------
    # SETUP: Add DLL path to environment for runtime execution
    # ------------------------------------------------------------------
    - name: Set DLL Runtime Path (Fix 0xc0000135)
      shell: pwsh
      run: |
        $dll_path = "${{ github.workspace }}\build\Release"
        Write-Host "Adding DLL path to environment for runtime search: $dll_path"
        # This permanently adds the path for subsequent steps in this job
        echo "PATH=$dll_path;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # ------------------------------------------------------------------
    # STEP 3: Build SOLVER executable 
    # ------------------------------------------------------------------
    - name: Build Solver Executable
      shell: pwsh
      run: cmake --build build --config Release --target solver
      
    # ------------------------------------------------------------------
    # STEP 3B: Run Solver Sanity Check
    # ------------------------------------------------------------------
    - name: Run Solver Sanity Check (solver.exe -h)
      shell: pwsh
      run: |
        $solver_exe = "${{ github.workspace }}\build\Release\solver.exe"
        Write-Host "Running $solver_exe -h..."
        & $solver_exe -h

    # ------------------------------------------------------------------
    # STEP 4: Build TESTS executable
    # ------------------------------------------------------------------
    - name: Build Test Executable
      shell: pwsh
      run: cmake --build build --config Release --target solver_tests
      
    # ------------------------------------------------------------------
    # STEP 4B: Run Tests
    # ------------------------------------------------------------------
    - name: Run Tests (ctest)
      shell: pwsh
      run: |
        # Use CTest to run tests defined by gtest_discover_tests
        ctest --test-dir build --output-on-failure -C Release

    - name: Upload solver binary
      uses: actions/upload-artifact@v4
      with:
        name: solver-windows-x64
        path: build/Release/

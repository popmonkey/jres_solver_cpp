name: Unix [reusable] Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      name:
        type: string
        required: true
      platform:
        type: string
        required: true
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
      asset_ext:
        type: string
        required: true
      upload_assets:
        type: boolean
        required: true
      upload_url:
        type: string
        required: false

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      # ---------------------------------------------------------
      # Debug Info
      # ---------------------------------------------------------
      - name: Print Build Info
        run: |
          echo "Version:   ${{ inputs.version }}"
          echo "Platform:  ${{ inputs.platform }}"
          echo "OS:        ${{ inputs.os }}"
          echo "Arch:      ${{ inputs.arch }}"

      # ---------------------------------------------------------
      # Checkout repo with submodules
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # ---------------------------------------------------------
      # CBC installation
      # ---------------------------------------------------------
      - name: Install CBC (Linux)
        if: inputs.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libcbc-dev

      - name: Install CBC (macOS)
        if: startsWith(inputs.os, 'macos')
        run: brew install cbc

      - name: Set CMAKE_PREFIX_PATH (Apple Silicon)
        if: inputs.os == 'macos-14'
        run: echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Build Tests
        run: cmake --build build --config Release --target solver_tests

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      # ---------------------------------------------------------
      # Package binaries
      # ---------------------------------------------------------

      - name: Sanitize Inputs
        run: |
          # Function to lowercase and replace invalid chars with _
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/_/g'
          }

          echo "SAFE_VERSION=$(sanitize "${{ inputs.version }}")" >> $GITHUB_ENV
          echo "SAFE_PLATFORM=$(sanitize "${{ inputs.platform }}")" >> $GITHUB_ENV
          echo "SAFE_ARCH=$(sanitize "${{ inputs.arch }}")" >> $GITHUB_ENV
          
      - name: Set Asset Name
        # Naming Convention: jres-solver-[version]-[platform]-[arch].tar.gz
        run: echo "ASSET_NAME=jres-solver-${{ env.SAFE_VERSION }}-${{ env.SAFE_PLATFORM }}-${{ env.SAFE_ARCH }}.${{ inputs.asset_ext }}" >> $env:GITHUB_ENV

      - name: Package (tar.gz)
        run: |
          cd build
          # Package commands and libs
          tar -czvf "../${{ env.ASSET_NAME }}" \
            solver \
            formatter \
            libjres_solver.* \
            2>/dev/null || true

      # ---------------------------------------------------------
      # Generate Signature (Checksum)
      # ---------------------------------------------------------
      - name: Generate Checksum
        run: |
          # Generate SHA256 checksum for the tarball
          shasum -a 256 ${{ env.ASSET_NAME }} > ${{ env.ASSET_NAME }}.sha256
          cat ${{ env.ASSET_NAME }}.sha256

      # ---------------------------------------------------------
      # Upload Artifacts
      # ---------------------------------------------------------
      - name: Upload Release Asset (Binary)
        if: inputs.upload_assets == true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/gzip

      - name: Upload Release Asset (Checksum)
        if: inputs.upload_assets == true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./${{ env.ASSET_NAME }}.sha256
          asset_name: ${{ env.ASSET_NAME }}.sha256
          asset_content_type: text/plain

name: Reusable Unix Build

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
      asset_ext:
        type: string
        required: true

      upload_assets:
        type: boolean
        required: true
      upload_url:
        type: string
        required: false

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      # ---------------------------------------------------------
      # Debug Info
      # ---------------------------------------------------------
      - name: Print Build Info
        run: |
          echo "Name:      ${{ inputs.name }}"
          echo "OS:        ${{ inputs.os }}"
          echo "Arch:      ${{ inputs.arch }}"
          echo "Ext:       ${{ inputs.asset_ext }}"

      # ---------------------------------------------------------
      # Checkout repo with submodules (cxxopts/json)
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: List lib directory
        run: ls -R lib || true

      # ---------------------------------------------------------
      # CBC installation (Linux)
      # ---------------------------------------------------------
      - name: Install CBC (Linux)
        if: inputs.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libcbc-dev

      # ---------------------------------------------------------
      # CBC installation (macOS)
      # ---------------------------------------------------------
      - name: Install CBC (macOS)
        if: startsWith(inputs.os, 'macos')
        run: brew install cbc

      # Apple Silicon Homebrew prefix
      - name: Set CMAKE_PREFIX_PATH (Apple Silicon)
        if: inputs.os == 'macos-14'
        run: echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Configure (normal platforms)
      # ---------------------------------------------------------
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # ---------------------------------------------------------
      # Build library + solver
      # ---------------------------------------------------------
      - name: Build Project
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Build tests
      # ---------------------------------------------------------
      - name: Build Tests
        run: cmake --build build --config Release --target solver_tests

      # ---------------------------------------------------------
      # Run tests
      # ---------------------------------------------------------
      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      # ---------------------------------------------------------
      # Package binaries
      # ---------------------------------------------------------
      - name: Set Asset Name
        run: echo "ASSET_NAME=jres-solver-${{ inputs.name }}.${{ inputs.asset_ext }}" >> $GITHUB_ENV

      - name: Package (tar.gz for macOS/Linux)
        run: |
          cd build
          # Include solver + shared library; ignore missing *.so or *.dylib automatically
          tar -czvf "../${{ env.ASSET_NAME }}" \
            solver \
            libjres_solver.* \
            2>/dev/null || true

      # ---------------------------------------------------------
      # Upload to release (if enabled)
      # ---------------------------------------------------------
      - name: Upload Release Asset
        if: inputs.upload_assets == true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream
